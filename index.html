<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حماية الدماغ - دماغك أهم من السكرول</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2d5a5a, #1a3d3d, #2d5a5a);
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .header {
            margin-bottom: 30px;
        }
        .title {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .subtitle {
            font-size: 1.3rem;
            opacity: 0.9;
        }
        .tip-card {
            background: rgba(255,255,255,0.98);
            color: #333;
            padding: 30px;
            border-radius: 20px;
            margin: 20px 0;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        .tip-icon {
            font-size: 4rem;
            margin-bottom: 15px;
        }
        .tip-title {
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .tip-description {
            font-size: 1.1rem;
            line-height: 1.6;
        }
        .progress {
            margin: 20px 0;
        }
        .progress-text {
            font-size: 1.1rem;
            margin-bottom: 10px;
        }
        .progress-bar {
            width: 100%;
            height: 20px;
            background: rgba(255,255,255,0.3);
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: #00C851;
            border-radius: 10px;
            transition: width 0.3s ease;
        }
        .nav-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 20px 0;
        }
        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background: #007E33;
            color: white;
            flex: 1;
            max-width: 200px;
        }
        .btn-primary:hover {
            background: #005722;
            transform: translateY(-2px);
        }
        .btn-secondary {
            background: rgba(255,255,255,0.2);
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .footer-credit {
            position: fixed;
            bottom: 20px;
            left: 20px;
            font-size: 2rem;
            font-style: italic;
            opacity: 0.8;
            animation: fadeIn 2s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 0.8; }
        }
        .counter {
            margin-top: 15px;
            opacity: 0.8;
        }
        @media (max-width: 600px) {
            .title { font-size: 2rem; }
            .subtitle { font-size: 1.1rem; }
            .container { padding: 15px; }
            .footer-credit { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">دماغك أهم من السكرول</h1>
            <p class="subtitle">نصائح بسيطة تخليها تشتغل كويس</p>
        </div>

        <div class="progress">
            <div class="progress-text" id="progressText">0 من 15</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
        </div>

        <div class="tip-card">
            <div class="tip-icon" id="tipIcon">📚</div>
            <h2 class="tip-title" id="tipTitle">اقرأ كتاب</h2>
            <p class="tip-description" id="tipDescription">30 دقيقة قراية كتاب حقيقي – مش ريلز ولا شورتس – بتبني تركيز وذاكرة. جرب قبل النوم بدل الموبايل.</p>
        </div>

        <div class="nav-buttons">
            <button class="btn btn-secondary" id="prevBtn" onclick="prevTip()">←</button>
            <button class="btn btn-primary" id="nextBtn" onclick="nextTip()">أنا جاهز</button>
            <button class="btn btn-secondary" id="nextBtn2" onclick="nextTip()">→</button>
        </div>

        <div class="counter" id="counter">1 من 15</div>
    </div>

    <div class="footer-credit">@Nour | Judy Mohammed</div>

    <script>
        const tips = [
            { title: "اقرأ كتاب", description: "30 دقيقة قراية كتاب حقيقي – مش ريلز ولا شورتس – بتبني تركيز وذاكرة. جرب قبل النوم بدل الموبايل.", icon: "📚" },
            { title: "امشي شوية", description: "مش محتاج جيم. حتى لو تمشيت للبقالة أو حوالين البيت – الحركة بتوصّل أوكسجين للدماغ وبتخلص التوتر.", icon: "🏃" },
            { title: "اتعلم حاجة غريبة عنك", description: "عزف، رسم، طبخ حاجة جديدة… أي حاجة تخلي دماغك يشتغل بطرق مختلفة. مش شرط تكون مبدع من أول مرة.", icon: "🎯" },
            { title: "السوشيال مش حياتك", description: "حدد ساعة في اليوم للإنستغرام والتيك توك. صدقني الـ scroll اللانهائي بياكل من تركيزك بدون ما تحس.", icon: "📱" },
            { title: "قابل حد فعلاً", description: "الكلام وجه لوجه – حتى لو قهوة مع صاحبك – مش زي الشات. العلاقات الحقيقية بتحمي صحتك النفسية أكتر مما تتخيل.", icon: "👥" },
            { title: "نام براحتك", description: "7-8 ساعات مش رفاهية. المخ بيعمل صيانة ليلاً ويغسل السموم. لو بتنام متقطع، ده أول حاجة تغيّرها.", icon: "😴" },
            { title: "وقف 10 دقائق", description: "تنفس، اقفل عينيك، خليك حاضر. مش لازم تسميها تأمل – بس استراحة حقيقية من الضجيج بتاع جواك.", icon: "🧘" },
            { title: "اكل يغذي مخك", description: "مش لازم دايت صارم. بس خضار، فواكه، مكسرات، سمك – مخك محتاج ده عشان يشتغل كويس.", icon: "🥗" },
            { title: "اكتب أي حاجة", description: "حتى لو مذكرات عشوائية. الكتابة بتنضف راسك وتساعدك تفهم نفسك. جرب قبل ما تنام.", icon: "✍️" },
            { title: "اشرب مية", description: "مخك 75% مية. لو مش شارب كويس، التركيز والذاكرة أول حاجة تتأثر. زجاجة جنبك طول اليوم.", icon: "💧" },
            { title: "اطلع برة", description: "شمس، هواء، شجرة حتى لو وحيدة. 15 دقيقة برة البيت بتفرق في المزاج والوضوح العقلي.", icon: "🌳" },
            { title: "العب حاجة تفتكر بيها", description: "سودوكو، شطرنج، حتى كلمات متقاطعة. 10 دقايق في اليوم بتحافظ على المخ زي الرياضة للجسم.", icon: "🧩" },
            { title: "قلل السكر", description: "السكر بيعملك طاقة وهمية وبعدين هبوط. استبدل الحلويات بالفواكه – مخك هيشكرك.", icon: "🍎" },
            { title: "استراحة من الشاشة", description: "كل 20 دقيقة: ارفع عينيك وشوف حاجة بعيدة 20 ثانية. عينيك ومخك محتاجين الراحة دي.", icon: "⏸️" },
            { title: "نام واستيقظ في ميعاد", description: "الميعاد الثابت – حتى في الإجازة – بيخلي نومك أعمق ودماغك أصفى. جرب أسبوع واحد وشوف.", icon: "🕐" }
        ];

        let currentIndex = 0;
        let completedTips = 0;

        function updateTip() {
            const tip = tips[currentIndex];
            document.getElementById('tipIcon').textContent = tip.icon;
            document.getElementById('tipTitle').textContent = tip.title;
            document.getElementById('tipDescription').textContent = tip.description;
            
            const progress = (completedTips / tips.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('progressText').textContent = `${completedTips} من ${tips.length}`;
            document.getElementById('counter').textContent = `${currentIndex + 1} من ${tips.length}`;
            
            const remaining = tips.length - currentIndex - 1;
            const nextBtn = document.getElementById('nextBtn');
            if (remaining === 0) {
                nextBtn.textContent = 'كملت';
            } else if (remaining === 1) {
                nextBtn.textContent = 'التانية أخيرة';
            } else if (remaining === 2) {
                nextBtn.textContent = 'آخر اثنين';
            } else {
                nextBtn.textContent = 'أنا جاهز';
            }
        }

        function nextTip() {
            if (currentIndex < tips.length - 1) {
                currentIndex++;
                completedTips++;
                updateTip();
            } else {
                alert('🎉 مبروك! خلصت كل النصائح. دلوقتي جرب تطبقهم شوية شوية!');
            }
        }

        function prevTip() {
            if (currentIndex > 0) {
                currentIndex--;
                completedTips = Math.max(0, completedTips - 1);
                updateTip();
            }
        }

        // Initialize
        updateTip();
    </script>
</body>
</html>
